<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CollectScan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- back | greeting | profile -->
  <header id="top-bar">
    <button id="back-btn" class="icon-btn" aria-label="Back">&#8592;</button>
    <span id="top-bar-title" class="pill pill-dark">Hello, Collector</span>
    <button id="profile-btn" class="icon-btn" aria-label="Profile">&#9679;</button>
  </header>

  <main id="main-content">
    <section id="view-auth" class="view" hidden></section>
    <section id="view-home" class="view"></section>
    <section id="view-collection" class="view" hidden></section>
    <section id="view-detail" class="view" hidden></section>
    <section id="view-form" class="view" hidden></section>
    <section id="view-scan" class="view" hidden></section>
    <section id="view-stats" class="view" hidden></section>
  </main>

  <!-- icon + label — becomes a side rail on wider screens -->
  <nav id="bottom-nav">
    <button data-view="home" class="nav-btn">
      <span class="nav-icon">&#8962;</span>
      <span class="nav-label">Home</span>
    </button>
    <button data-view="scan" class="nav-btn">
      <span class="nav-icon">&#128247;</span>
      <span class="nav-label">Scan</span>
    </button>
    <button data-view="collection" class="nav-btn">
      <span class="nav-icon">&#128218;</span>
      <span class="nav-label">Collection</span>
    </button>
    <button data-view="stats" class="nav-btn">
      <span class="nav-icon">&#128202;</span>
      <span class="nav-label">Stats</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="modal-root"></div>

</div>

<script src="app.js"></script>
</body>
</html>
